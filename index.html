<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Youssef & Aya</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
:root{--bg1:#fbeeee;--bg2:#f1c9d0;--ink:#4a1526;--accent:#b23a5b;--gold1:#f1d9a0;--gold2:#b98b4a;--l1:#fdeaee;--l2:#f0bccb;--card:rgba(255,255,255,.55);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#4a1330;--bg2:#12050b;--ink:#f8e4e6;--accent:#f0a3b6;--l1:#5b2540;--l2:#33121f;--card:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg1:#4a1330;--bg2:#12050b;--ink:#f8e4e6;--accent:#f0a3b6;--l1:#5b2540;--l2:#33121f;--card:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2) 75%);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:1.3rem;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:1.5rem;transition:opacity .9s}
#lock{justify-content:center;background:linear-gradient(160deg,var(--l1),var(--l2))}
.card{width:min(320px,86vw);padding:2rem 1.4rem 1.8rem;border-radius:28px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 16px 40px rgba(120,30,60,.18);border:1px solid rgba(255,255,255,.35)}
.welcome{font-family:"Great Vibes",cursive;font-weight:400;font-size:1.9rem;line-height:1.2;margin:.6rem 0 0;color:var(--accent)}
.welcome.yoyo{font-size:2.6rem;margin-top:.3rem}
.hint{margin:.6rem 0 1.2rem;font-style:italic}
#lock input{font:inherit;font-size:1.9rem;letter-spacing:.5em;text-align:center;width:10rem;padding:.35rem .2rem .35rem .7rem;background:rgba(255,255,255,.35);border:2px solid var(--accent);border-radius:999px;color:var(--ink);outline:none}
#lock input:focus-visible{box-shadow:0 0 0 4px rgba(178,58,91,.25)}
#lock p.e{margin:.9rem 0 0;min-height:1.4em}
.lockicon{font-size:2.6rem;animation:beat 1.4s infinite}
.shake{animation:shake .4s}
#reveal{opacity:0;pointer-events:none;overflow-y:auto;justify-content:flex-start;padding:2.2rem 1.5rem 4rem;z-index:2}
#reveal.on{opacity:1;pointer-events:auto}
h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(2.8rem,13vw,4.8rem);line-height:1.1;margin:0;color:var(--accent)}
.h{display:inline-block;animation:beat 1.2s infinite}
.frame{--r:-2deg;width:min(90px,26vw);margin:0;padding:5px;background:linear-gradient(135deg,var(--gold1),var(--gold2) 55%,var(--gold1));border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.35);transform:rotate(var(--r));position:relative}
.frame.b{--r:2deg}
.frames{display:flex;gap:1.5rem;justify-content:center;align-items:flex-start;margin:1.4rem 0 0}
.frame::after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.55);pointer-events:none}
.frame img{display:block;width:100%;height:auto;max-height:17vh;object-fit:cover;border-radius:2px}
.frame.b .heart{right:auto;left:-9px}
.frame .heart{position:absolute;right:-9px;bottom:-11px;font-size:1.2rem;animation:beat 1.2s .4s infinite}
.names{font-family:"Great Vibes",cursive;font-size:clamp(2.2rem,10vw,3.4rem);margin:1.6rem 0 0;line-height:1.2}
.names .r{display:inline-block;animation:sway 3s ease-in-out infinite}
.msg{max-width:30rem;margin:1.4rem 0 0;line-height:1.6;font-style:italic;text-align:center}
.msg p{margin:0 0 .9rem}
.songrow{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:center;max-width:30rem;margin-top:.6rem;opacity:0;pointer-events:none;transition:opacity 1.2s}
.songrow.on{opacity:1;pointer-events:auto}
.songnote{font-style:italic}
.song{display:inline-block;padding:.7rem 1.6rem;border:2px solid var(--accent);border-radius:999px;color:var(--ink);text-decoration:none;font-size:1.25rem;transition:background .3s}
.song:hover,.song:focus-visible{background:var(--accent);color:var(--bg2)}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);margin-left:2px;vertical-align:-.15em;animation:blink .8s steps(1) infinite}
#reveal.on h1{animation:rise 1.2s both}
#reveal.on .frame{animation:pop 1.2s .5s both}
#reveal.on .frame.b{animation-delay:.9s}
#reveal.on .names{animation:rise 1.2s 1.1s both}
.fl{position:absolute;bottom:-3rem;pointer-events:none;z-index:1;animation:float linear forwards}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
@keyframes sway{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:rotate(var(--r)) scale(.8)}to{opacity:1;transform:rotate(var(--r)) scale(1)}}
@keyframes blink{50%{opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes float{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

    <p class="hint">Enter the password</p>
    <input id="pw" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Password">
    <p id="err" class="e"></p>

</div>

<script>
var P=["One year with you, my girl ❤️ I hope you’ll always be by my side, and I hope we stay together for the rest of our lives.","I honestly don’t know how to describe you with words because you’re the most precious person to me. No matter how hard I try to put my love for you into words, I’ll never be able to express how much you mean to me.","You’re so special to me, and I’m so grateful to have you in my life. I love you so much, my girl, and I hope we’ll always have each other forever ♥️♥️♥️♥️♥️"];
var pw=document.getElementById('pw'),err=document.getElementById('err'),lock=document.getElementById('lock'),rev=document.getElementById('reveal'),box=document.getElementById('typed');
pw.focus();
pw.addEventListener('input',function(){
  if(pw.value.length<4)return;
  if(pw.value==='1605'){
    lock.style.opacity=0;lock.style.pointerEvents='none';rev.classList.add('on');
    setInterval(spawn,450);setTimeout(typeAll,2400);
  }else{
    err.textContent='Wrong password';pw.classList.remove('shake');void pw.offsetWidth;pw.classList.add('shake');pw.value='';
  }
});
function typeAll(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){P.forEach(function(t){var e=document.createElement('p');e.textContent=t;box.appendChild(e)});showSong();return}
  var pi=0,ci=0,caret=document.createElement('span'),p=document.createElement('p');
  caret.className='caret';box.appendChild(p);
  (function tick(){
    if(pi>=P.length){caret.remove();showSong();return}
    var t=P[pi];
    if(ci<t.length){
      ci++;p.textContent=t.slice(0,ci);p.appendChild(caret);rev.scrollTop=rev.scrollHeight;
      setTimeout(tick,/[.,]/.test(t[ci-1])?220:32);
    }else{
      pi++;ci=0;
      if(pi<P.length){p=document.createElement('p');box.appendChild(p)}
      setTimeout(tick,600);
    }
  })();
}
function showSong(){document.getElementById('songrow').classList.add('on')}
function spawn(){
  var e=document.createElement('span'),a=['❤️','🌹','💗','🌸'];
  e.className='fl';e.textContent=a[Math.floor(Math.random()*a.length)];
  e.style.left=Math.random()*94+'%';e.style.fontSize=(1+Math.random()*1.6)+'rem';
  e.style.animationDuration=(6+Math.random()*5)+'s';
  document.body.appendChild(e);setTimeout(function(){e.remove()},11500);
}
</script>
